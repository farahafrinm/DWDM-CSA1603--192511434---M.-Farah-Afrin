<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hillora — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #EAF0E4; }
  .card { background: #fff; padding: 40px; border-radius: 16px; width: 100%; max-width: 380px; }
  .card-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #1B3B30; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  h2 { font-family: 'Fraunces', serif; text-align: center; color: #16261F; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: #16261F; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid #dfe3de; border-radius: 8px; font-size: 0.95rem; }
  .btn { width: 100%; padding: 14px; background: #1B3B30; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  #message { text-align: center; margin-top: 14px; font-size: 0.85rem; min-height: 1em; }
  .login-line { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #4A6B58; }
  .login-line a { color: #3E7C4A; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-logo">🌿</div>
    <h2>Create your Hillora account</h2>
    <div class="field"><label>Username</label><input type="text" id="username"></div>
    <div class="field"><label>Email</label><input type="email" id="email"></div>
    <div class="field"><label>Password</label><input type="password" id="password"></div>
    <button class="btn" onclick="signup()">Create Account</button>
    <div id="message"></div>
    <p class="login-line">Already have an account? <a href="/login.html">Log in</a></p>
  </div>

<script>
async function signup() {
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const messageDiv = document.getElementById('message');

  const response = await fetch('/api/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password })
  });
  const data = await response.json();

  if (response.ok) {
    messageDiv.style.color = '#3E7C4A';
    messageDiv.textContent = 'Account created! Redirecting to login...';
    setTimeout(() => window.location.href = '/login.html', 1500);
  } else {
    messageDiv.style.color = '#C1666B';
    messageDiv.textContent = data.error;
  }
}
</script>
</body>
</html>
